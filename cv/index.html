uage learning enjoyment scale for Taiwanese learners (2025) and a BERTopic-based analysis of intercultural research trends in Korean language education (2026). He has over a decade of professional experience as a Korean-Chinese interpreter and translator. His current research applies topic modeling to multilingual academic corpora.","orcid":{"id":"0009-0000-8718-3388","url":"https://orcid.org/0009-0000-8718-3388"},"dl":{"label":"Download CV (PDF) ↓","file":"pdf/yu-hungpin-cv-en.pdf","name":"游宏斌_CV_EN.pdf"},"pubs":[{"y":2026,"cko":"유홍빈. (2026). 대만어 배경을 지닌 대만인 한국어 학습자의 어휘 유사성 인식 -학습 흥미와 동기를 중심으로-. 이중언어학, 105, 279-309.","cen":"Hungpin Yu. (2026). Perceptions of Taigi-Korean Lexical Similarity among Taiwanese Learners of Korean with Taigi Backgrounds: Focusing on Learning Interest and Motivation. Bilingual Research, 105, 279-309.","doi":"10.17296/korbil.2026..105.279","doiUrl":"https://doi.org/10.17296/korbil.2026..105.279","tr":null,"kci":"KCI-indexed"},{"y":2026,"cko":"유홍빈. (2026). BERTopic을 활용한 대만 한국어교육 연구 동향. 외국어로서의 한국어교육, 82, 145-179.","cen":"Yu Hung-pin. (2026). Research Trends in Korean Language Education in Taiwan Using BERTopic. Teaching Korean as a Foreign Language, 82, 145-179.","doi":"10.21716/TKFL.82.6","doiUrl":"https://doi.org/10.21716/TKFL.82.6","tr":null,"kci":"KCI-indexed"},{"y":2026,"cko":"고혜민, 이경희 and 유홍빈. (2026). BERTopic을 활용한 한국어교육 분야의 상호문화 연구 동향 분석. 문화교류와 다문화교육, 15(3), 363-393.","cen":"Hyemin Go, LEE KYUNG HEE and Hungpin Yu. (2026). A Topic Modeling Analysis of Intercultural Research Trends in Korean Language Education Using BERTopic. Cultural Exchange and Multicultural Education, 15(3), 363-393.","doi":"10.30974/kaice.2026.15.3.15","doiUrl":"https://doi.org/10.30974/kaice.2026.15.3.15","tr":null,"kci":"KCI-indexed"},{"y":2025,"cko":"유홍빈, 송봉운 and 고혜민. (2025). 대만인 한국어 학습자의 즐거움 척도 개발 및 적용 방안 연구. 이중언어학, 100, 273-304.","cen":"Hungpin Yu, Bongwoon Song and Hyemin Go. (2025). A Study on the Development and Application of a Korean Language Learning Enjoyment Scale for Taiwanese Learners. Bilingual Research, 100, 273-304.","doi":"10.17296/korbil.2025..100.273","doiUrl":"https://doi.org/10.17296/korbil.2025..100.273","tr":null,"kci":"KCI-indexed"},{"y":2024,"cko":"고혜민, 유홍빈 and 김낭예. (2024). 조선어교재에 나타난 학습 활동 연구-김일성종합대학 출판 <조선어>(2022)를 중심으로-. 한국언어문화학, 21(1), 1-29.","cen":"Go Hye-min, Yu Hung-pin and Kim Nang-Ye. (2024). An Analysis of Learning Activities in North Korea Language Textbooks-Focusing on the 'Joseoneo' Publications of Kim Il Sung University (2022)-. Journal of the International Network for Korean Language and Culture, 21(1), 1-29.","doi":"10.15652/ink.2024.21.1.001","doiUrl":"https://doi.org/10.15652/ink.2024.21.1.001","tr":null,"kci":"KCI-indexed"}],"langs":[{"name":"Taiwanese Mandarin / Taiwanese Taigi","level":"Native"},{"name":"Korean 한국어","level":"Full Professional Working Language · PhD Candidate in Korean Linguistics (Kyung Hee) · Korean Teacher Certificate Lv.2 · TOPIK II Level 6 (Highest)"},{"name":"English","level":"Professional Working Proficiency · English Major, B.A."},{"name":"Spanish / Español","level":"Advanced (C1 Superior) · Instituto Cervantes, certified APTO · DELE B2"}],"certs":[{"name":"Korean Teacher Certificate (Level 2)","issuer":"National Institute of Korean Language"},{"name":"2nd Korean Interpretation & Translation Education Workshop","issuer":"International Network for Korean Interpretation and Translation · completed Aug 2026"},{"name":"4th Overseas Youth Quiz Championship","issuer":"Grand Prize · Minister of Culture Award"}],"titleTag":"Yu Hung-Pin — CV","_lb":{"1rucckr":"2-3 7-8","txc938":"1-6","kdmp2w":"16-17 36-37 52-53 63-64 71-72 80-81 88-89 94-95 111-112 115-116 126-127 131-132 134-135 142-144 146-147","e3ccbe":"14-17 23-24","9ljxn7":"6-7","12tiv2g":"8-9","uirve4":"30-31","1ngyhig":"4-5 9-10 77-78","1xk8pnr":"7-8","13fzkfk":"4-5 9-10","12zzftg":"11-12","rsoqos":"13-14","1l4i1gq":"8-9","12tkulb":"5-6 14-15","1k39fam":"14-17","ew2se1":"15-16","g5mvzg":"5-8","1t81jrt":"6-7"   document.querySelectorAll('.langpill button').forEach(b => b.classList.toggle('on', b.dataset.l === l));

  try { const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null,'',u); } catch(e) {}
}
const detect = () => { try { const prefs = navigator.languages || [navigator.language || 'en']; for (const pf of prefs) { const b = String(pf).toLowerCase().split('-')[0]; if (b === 'zh') return 'zh'; if (['ko','es','en'].includes(b)) return b; } } catch(e) {} return 'en'; };
const param = new URLSearchParams(location.search).get('lang');
let lang = ['zh','ko','en','es'].includes(param) ? param : ((function(){try{return localStorage.getItem('sw-lang')}catch(e){return null}})() || detect());
if (!['zh','ko','en','es'].includes(lang)) lang = 'zh';
document.querySelectorAll('.langpill button').forEach(b => b.addEventListener('click', () => render(b.dataset.l)));
render(lang);
