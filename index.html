         (orientation:landscape) and (max-height:380px) and (pointer:coarse){

  }

  <script src="scrub-engine.js"></script>
  <script src="world-config.js"></script>
  <script>
  (function () {
    const W = window.WORLD;
    const PH = window.USE_PLACEHOLDERS;

    // language: ?lang= param > localStorage > default
    const param = new URLSearchParams(location.search).get('lang');
    // browser-language auto-detect (same logic as the original site)
    const detect = () => { try { const prefs = navigator.languages || [navigator.language || 'en']; for (const pf of prefs) { const b = String(pf).toLowerCase().split('-')[0]; if (b === 'zh') return 'zh'; if (['ko', 'es', 'en'].includes(b)) return b; } } catch (e) {} return 'en'; };
    let lang = W.langs.includes(param) ? param : (localStorage.getItem('sw-lang') || detect());
    if (!W.langs.includes(lang)) lang = W.defaultLang;

    const HTML_LANG = { zh: 'zh-Hant', ko: 'ko', en: 'en', es: 'es' };

    // GA event helper — silently no-ops if gtag is blocked by the browser
    const track = (name, params) => { try { window.gtag && gtag('event', name, params || {}); } catch (e) {} };

    function assetsFor(scene) {
      if (PH) return {
        still: 'assets/stills/ph-' + scene.id + '.svg',
        stillMobile: 'assets/stills/ph-' + scene.id + '-m.svg',
        clip: null, clipMobile: null,
      };
      // MOBILE_READY flips on once the native 9:16 chain is rendered (pipeline §6b);
      // until then phones fall back to the desktop clip (engine handles it).
      const M = window.MOBILE_READY;
      return {
        still: 'assets/stills/' + scene.id + '.webp',
        stillMobile: M ? 'assets/stills/' + scene.id + '-m.webp' : undefined,
        clip: 'assets/vid/' + scene.id + '.mp4',
        clipMobile: M ? 'assets/vid/' + scene.id + '-m.mp4' : undefined,
      };
    }

    function sectionsFor(l) {
      const copy = W.copy[l];
      const cv = copy[copy.length - 1].cta && copy[copy.length - 1].cta.tertiary;
      return W.scenes.map((scene, i) => {
        const s = Object.assign(
          { id: scene.id, accent: '#E8410E', scroll: scene.scroll, linger: scene.linger },
          assetsFor(scene),
          copy[i]
        );
        // the CV is one tap away on the very first scene too, not only at the end
        if (s.cta && cv) s.cta = Object.assign({}, s.cta, { tertiary: { label: cv.label, href: '/cv/?lang=' + l } });
        return s;
      });
    }

    // ---- mount once ----
    const container = document.getElementById('world');
    mountScrollWorld(container, {
      brand: { name: W.brandName, href: '#top' },
      nav: false,
      cta: { label: W.topCta[lang], href: 'mailto:' + W.email },
      hint: W.hints[lang],
      diveScroll: 1.3,
      crossfade: 0.08,               // architecture A: legs chain directly, tiny dissolve
      preloadAll: true,              // the loading screen fetches the whole film (see intro below)
      sections: sectionsFor(lang),
      connectors: [],                // continuous forward take — no connectors
    });

    // ---- language switching: swap copy in place (video chain untouched) ----
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const pad = n => String(n).padStart(2, '0');

    function applyLanguage(l) {
      lang = l;
      localStorage.setItem('sw-lang', l);
      document.documentElement.lang = HTML_LANG[l];
      document.title = W.titles[l];
      const secs = sectionsFor(l);
      const N = secs.length;
      container.querySelectorAll('.sw-copy').forEach((c, i) => {
        const s = secs[i]; if (!s) return;
        c.innerHTML =
          '<span class="sw-copy__num">' + pad(i + 1) + ' / ' + pad(N) + '</span>' +
          (s.eyebrow ? '<span class="sw-copy__eyebrow">' + esc(s.eyebrow) + '</span>' : '') +
          (s.title ? '<h2 class="sw-copy__title">' + esc(s.title) + '</h2>' : '') +
          (s.role ? '<p class="sw-copy__role">' + esc(s.role) + '</p>' : '') +
          (s.body ? '<p class="sw-copy__body">' + esc(s.body) + '</p>' : '') +
          (s.tags && s.tags.length ? '<ul class="sw-copy__tags">' + s.tags.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>' : '') +
          (s.cta ? '<div class="sw-copy__cta">' +
            (s.cta.primary ? '<a class="sw-btn sw-btn--primary" href="' + esc(s.cta.primary.href) + '">' + esc(s.cta.primary.label) + '</a>' : '') +
            (s.cta.secondary ? '<a class="sw-btn sw-btn--ghost" href="' + esc(s.cta.secondary.href) + '">' + esc(s.cta.secondary.label) + '</a>' : '') +
            (s.cta.tertiary ? '<a class="sw-btn sw-btn--ghost sw-btn--cv" href="' + esc(s.cta.tertiary.href) + '">' + esc(s.cta.tertiary.label) + '</a>' : '') +
            '</div>' : '');
      });
      container.querySelectorAll('.sw-nav__item').forEach((b, i) => { if (secs[i]) b.textContent = secs[i].label || ''; });
      container.querySelectorAll('.sw-route__label').forEach((r, i) => { if (secs[i]) r.textContent = secs[i].label || ''; });
      const topcta = container.querySelector('.sw-topcta'); if (topcta) topcta.textContent = W.topCta[l];
      const back = container.querySelector('.sw-backlink'); if (back) back.textContent = W.skips[l] + ' \u2197';
      if (typeof cvLinkUpdate === 'function') cvLinkUpdate(l);
      const hint = container.querySelector('.sw-hint span'); if (hint) hint.textContent = W.hints[l];
      endCardUpdate(l);
      document.querySelectorAll('.lang-pill button').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
      if (typeof sndLabelUpdate === 'function') try { sndLabelUpdate(); } catch (e) {}
      if (typeof playLabelUpdate === 'function') try { playLabelUpdate(); } catch (e) {}
      const url = new URL(location.href); url.searchParams.set('lang', l); history.replaceState(null, '', url);
    }

    // switcher UI
    const pill = document.createElement('div'); pill.className = 'lang-pill';
    const NAMES = { zh: '中', ko: '한', en: 'EN', es: 'ES' };
    W.langs.forEach(l => {
      const b = document.createElement('button');
      b.dataset.lang = l; b.textContent = NAMES[l];
      b.addEventListener('click', () => { applyLanguage(l); track('film_lang', { lang: l }); });
      pill.appendChild(b);
    });
    document.body.appendChild(pill);

    if (PH) {
      const n = document.createElement('div'); n.className = 'previz-note';
      n.textContent = 'PREVIZ — 場景為佔位圖，待 Higgsfield 實景渲染';
      document.body.appendChild(n);
    }


    // persistent "back to the full portfolio" link in the topbar (plan B: the
    // original site stays the homepage; this page lives at /world)
    const topbar = container.querySelector('.sw-topbar');
    const backLink = document.createElement('a');
    backLink.className = 'sw-backlink';
    backLink.href = W.site;
    topbar.insertBefore(backLink, container.querySelector('.sw-topcta'));
    // CV link right next to it, so the CV is one tap away from the first frame
    // (label = the end card's own CV word; ?lang keeps the visitor's language)
    const cvLink = document.createElement('a');
    cvLink.className = 'sw-cvlink';
    topbar.insertBefore(cvLink, container.querySelector('.sw-topcta'));
    function cvLinkUpdate(l) { cvLink.textContent = (W.endcard && W.endcard[l] && W.endcard[l].cv) || 'CV'; cvLink.href = '/cv/?lang=' + l; }
    cvLinkUpdate(lang);

    // one-line explanation inside the intro: scroll drives the camera, 7 scenes
    const EXPLAIN = {
      zh: '\u5f80\u4e0b\u6372\u52d5 \u00b7 \u8ddf\u8457\u93e1\u982d\u8d70\u904e 7 \u500b\u5de5\u4f5c\u73fe\u5834',
      ko: '\uc2a4\ud06c\ub864\ud558\uba74 \uce74\uba54\ub77c\uac00 7\uac1c\uc758 \ud604\uc7a5\uc744 \uc548\ub0b4\ud569\ub2c8\ub2e4',
      en: 'Scroll \u2014 the camera walks through 7 scenes',
      es: 'Despl\u00e1zate \u2014 la c\u00e1mara recorre 7 escenas'
    };
    const explainEl = document.getElementById('sw-intro-explain');
    if (explainEl) explainEl.textContent = EXPLAIN[lang] || EXPLAIN.zh;

    // first-visit nudge: if nothing is scrolled shortly after the intro, glide
    // down once so the visitor SEES scroll driving the camera. Any input cancels.
    const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function armNudge() {
      if (REDUCE) return;
      let cancelled = false;
      const cancel = () => { cancelled = true; ['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach(ev => removeEventListener(ev, cancel)); };
      ['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach(ev => addEventListener(ev, cancel, { passive: true }));
      setTimeout(() => {
        if (cancelled || (scrollY || 0) > 30) return;
        const target = innerHeight * 0.55, T = 1700, t0 = performance.now();
        (function step(t) {
          if (cancelled) return;
          const k = Math.min(1, (t - t0) / T), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
          window.scrollTo(0, target * e);
          if (k < 1) requestAnimationFrame(step);
        })(t0);
      }, 3500);
    }

    // intro doubles as the preloader: it holds until the clips of the first two
    // scenes are in (min 3.5s for the animation, max 8s), then the film starts and
    // the other clips keep downloading in the background, nearest scene first — a
    // visitor takes far longer to scroll through two scenes than the rest takes to
    // arrive. (Waiting for all seven made the loading screen feel too long.) The
    // counter is the progress of those first clips, taken from the engine's own
    // downloads (sw:clip-progress / -loaded). The top bar sits above the intro, so
    // portfolio / CV / contact are tappable from the very first second.
    const intro = document.getElementById('sw-intro');
    const endIntro = () => { if (intro) intro.remove(); document.body.classList.remove('sw-intro-on'); };
    if (intro) {
      document.body.classList.add('sw-intro-on');
      intro.addEventListener('click', () => { endIntro(); track('film_intro_skip'); });
      const prog = document.getElementById('sw-intro-prog');
      const minT = new Promise(r => setTimeout(r, 3500));
      const need = Math.min(2, window.__swClipCount || 0);
      const frac = {}, order = [];   // the first `need` clips the engine starts on (nearest scenes)
      let shown = 0, landedN = 0, finished = false;
      if (!need && prog) prog.style.display = 'none';
      const paint = () => {
        if (!prog || finished) return;   // after the exit, later downloads must not rewrite the counter
        let sum = 0; for (const u of order.slice(0, need)) sum += frac[u] || 0;
        shown = Math.max(shown, Math.min(99, Math.floor(sum / need * 100)));   // never runs backwards
        prog.textContent = shown + '%';
      };
      const seen = u => { if (u && !order.includes(u)) order.push(u); };
      const load = !need ? Promise.resolve() : new Promise(res => {
        addEventListener('sw:clip-progress', e => { const d = e.detail || {}; seen(d.url); if (d.total) { frac[d.url] = Math.min(1, d.got / d.total); paint(); } });
        // a clip that is missing for good (4xx) counts as done, so the screen doesn't wait the full 8 s for it
        const done = e => { const u = (e.detail || {}).url; seen(u); frac[u] = 1; paint(); if (++landedN >= need) res(); };
        addEventListener('sw:clip-loaded', done);
        addEventListener('sw:clip-dead', done);
      });
      Promise.race([Promise.all([minT, load]), new Promise(r => setTimeout(r, 8000))]).then(() => {
        finished = true;
        if (prog) prog.textContent = '100%';
        intro.classList.add('done');
        setTimeout(endIntro, 700);
        armNudge();
      });
    } else { armNudge(); }
    // brand mark -> the original site's 譯~역 seal
    const mark = container.querySelector('.sw-brand__mark');
    if (mark) mark.innerHTML = '<span class="seal-yi">譯</span><span class="seal-tilde">~</span><span class="seal-yeok">역</span>';

    // ambience — the films' own generated audio: ONE active track that follows
    // the scene under the viewport, with a short crossfade at each boundary.
    // Two <audio> elements max (robust on iOS; the first play() is fired inside
    // the tap so the page's audio unlocks). Off by default; reduced-motion skips it.
    const SND_LABEL = { zh: '\u97f3\u6548', ko: '\ud6a8\uacfc\uc74c', en: 'Sound', es: 'Sonido' };
    const sndBtn = document.createElement('button');
    sndBtn.className = 'snd-btn';
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.body.appendChild(sndBtn);
    const sceneIds = W.scenes.map(s => s.id);
    const widths = W.scenes.map(s => s.scroll || 1.3);
    const VOL = 0.55;
    let ambOn = false, elA = null, elB = null, active = null, curIdx = -1, ambRAF = 0;
    function sndLabelUpdate() { sndBtn.textContent = '\u266a ' + SND_LABEL[lang] + (ambOn ? ' ON' : ' OFF'); sndBtn.classList.toggle('on', ambOn); }
    function mkAudio() { const a = new Audio(); a.loop = true; a.preload = 'none'; a.volume = 0; return a; }
    function activeSceneIndex() {
      const vh = innerHeight, y = (scrollY || 0) + vh * 0.5;
      let off = 0;
      for (let i = 0; i < widths.length; i++) { const st = off * vh; off += widths[i]; if (y >= st && y < off * vh) return i; }
      return Math.max(0, Math.min(widths.length - 1, Math.floor(y / vh)));
    }
    function fade(el, to, ms) {
      if (!el) return; const from = el.volume, t0 = performance.now();
      (function step(t) { const k = Math.min(1, (t - t0) / ms); el.volume = Math.max(0, Math.min(1, from + (to - from) * k));
        if (k < 1) requestAnimationFrame(step); else if (to === 0) { try { el.pause(); } catch (e) {} } })(t0);
    }
    function playScene(i) {
      curIdx = i;
      const next = (active === elA) ? elB : elA;
      try { next.src = 'assets/aud/' + sceneIds[i] + '.m4a'; next.currentTime = 0; } catch (e) {}
      next.volume = 0; next.play().catch(() => {});
      fade(next, VOL, 600); if (active) fade(active, 0, 600); active = next;
    }
    function ambLoop() { if (!ambOn) return; const i = activeSceneIndex(); if (i !== curIdx) playScene(i); ambRAF = requestAnimationFrame(ambLoop); }
    let sndOptOut = false;
    sndBtn.addEventListener('click', () => {
      ambOn = !ambOn;
      if (ambOn) { if (!elA) { elA = mkAudio(); elB = mkAudio(); } active = null; playScene(activeSceneIndex()); ambLoop(); }
      else { cancelAnimationFrame(ambRAF); fade(elA, 0, 300); fade(elB, 0, 300); sndOptOut = true; }
      track('film_sound', { action: ambOn ? 'on' : 'off' });
      sndLabelUpdate();
    });
    sndLabelUpdate();

    // ── film mode: the videos PLAY natively (real 24fps, no seek judder) and
    // the page scroll follows playback time. Engine's seek loop stands down
    // via window.__swNativePlay. Any wheel/touch/key input hands control back.
    const PLAY_LABEL  = { zh: '▶ 自動播放', ko: '▶ 자동 재생', en: '▶ Autoplay', es: '▶ Reproducir' };
    const PAUSE_LABEL = { zh: '❚❚ 暫停', ko: '❚❚ 일시정지', en: '❚❚ Pause', es: '❚❚ Pausa' };
    // film speed: the clips are slow, cinematic 10 s takes; 1.5× keeps the camera
    // moving (≈47 s for all seven scenes instead of 70 s)
    const FILM_RATE = 1.5;
    window.__swFilmRate = FILM_RATE;
    const playBtn = document.createElement('button');
    playBtn.className = 'sw-play';
    if (!REDUCE && !window.__swNoClips) document.body.appendChild(playBtn);
    let playing = false, playRAF = 0, filmScene = -1;
    function playLabelUpdate() { playBtn.textContent = playing ? PAUSE_LABEL[lang] : PLAY_LABEL[lang]; playBtn.classList.toggle('on', playing); }
    function sceneVideo(i) { const sc = container.querySelectorAll('.sw-scene')[i]; return sc ? sc.querySelector('video') : null; }
    function segBounds(i) { const vh = innerHeight; let off = 0; for (let k = 0; k < i; k++) off += widths[k]; return [off * vh, (off + widths[i]) * vh]; }
    function stopPlay() {
      if (!playing) return;
      playing = false; window.__swNativePlay = false;
      cancelAnimationFrame(playRAF);
      container.querySelectorAll('.sw-scene video').forEach(v => { try { v.pause(); } catch (e) {} });
      playLabelUpdate();
      track('film_autoplay', { action: 'pause' });
    }
    function startScene(i, fromStart) {
      filmScene = i;
      const v = sceneVideo(i);
      if (v) { try { if (fromStart) v.currentTime = 0; } catch (e) {} v.muted = true; v.__chase = false; v.playbackRate = FILM_RATE; v.play().catch(() => {}); }
    }
    function filmTick() {
      if (!playing) return;
      const v = sceneVideo(filmScene);
      if (v && v.readyState >= 2 && v.duration) {
        const b = segBounds(filmScene);
        const pr = Math.min(1, v.currentTime / v.duration);
        if (v.paused && !v.ended && pr < 0.995) v.play().catch(() => {});   // something paused it (e.g. a late priming call): resume
        window.scrollTo(0, b[0] + pr * (b[1] - b[0]));
        if (pr >= 0.995 || v.ended) {
          try { v.pause(); } catch (e) {}
          if (filmScene < widths.length - 1) startScene(filmScene + 1, true);
          else { stopPlay(); return; }
        }
      } else {
        // clip not blob-loaded yet: park the scroll just inside the scene so the
        // engine lazy-loads it; the still stays up until playback can begin.
        const b = segBounds(filmScene);
        if ((scrollY || 0) < b[0] + 2) window.scrollTo(0, b[0] + 2);
      }
      playRAF = requestAnimationFrame(filmTick);
    }
    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (playing) { stopPlay(); return; }
      playing = true; window.__swNativePlay = true;
      const max = document.querySelector('.sw-track').offsetHeight - innerHeight;
      let i = activeSceneIndex(), fromStart = false;
      if ((scrollY || 0) >= max - 2) { window.scrollTo(0, 0); i = 0; fromStart = true; }  // replay from the top
      startScene(i, fromStart);
      if (!ambOn && !sndOptOut) sndBtn.click();               // film mode brings its sound
      playRAF = requestAnimationFrame(filmTick);
      playLabelUpdate();
      track('film_autoplay', { action: 'play', scene: sceneIds[i] });
    });
    ['wheel', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, () => stopPlay(), { passive: true }));
    playLabelUpdate();

    // ── end card: once the film has played out, make it unmissable that this
    // was only the trailer — portfolio / CV / contact exits front and center.
    // Appears near the end of the finale, retreats if the visitor scrolls back.
    const endCard = document.createElement('div');
    endCard.className = 'sw-endcard';
    document.body.appendChild(endCard);
    let endCardSeen = false;
    function endCardUpdate(l) {
      const E = (W.endcard && W.endcard[l]) || null; if (!E) return;
      endCard.innerHTML =
        '<div class="sw-endcard__line">' + esc(E.line) + '</div>' +
        '<div class="sw-endcard__row">' +
          '<a class="ec-portfolio" href="' + esc(W.site) + '">' + esc(E.portfolio) + ' →</a>' +
          '<a class="ec-cv" href="/cv/?lang=' + l + '">' + esc(E.cv) + '</a>' +
          '<a class="ec-contact" href="mailto:' + esc(W.email) + '">' + esc(E.contact) + '</a>' +
        '</div>';
    }
    function endCardCheck() {
      const tr = document.querySelector('.sw-track'); if (!tr) return;
      const max = tr.offsetHeight - innerHeight; if (max <= 0) return;
      const pr = (scrollY || 0) / max;
      if (pr >= 0.985) {
        setEcLift();
        if (!endCard.classList.contains('show')) {
          endCard.classList.add('show');
          document.body.classList.add('ec-on');
          if (!endCardSeen) { endCardSeen = true; track('film_end_card'); }
        }
      } else if (pr < 0.96 && endCard.classList.contains('show')) {
        endCard.classList.remove('show');
        document.body.classList.remove('ec-on');
      }
    }
    // phones lift the closing copy just above the card (see .ec-on CSS); the card's
    // height changes with the language and when web fonts swap in, so keep it in step
    function setEcLift() { document.body.style.setProperty('--ec-lift', (endCard.offsetHeight + 30) + 'px'); }
    if (window.ResizeObserver) new ResizeObserver(() => { if (endCard.classList.contains('show')) setEcLift(); }).observe(endCard);
    addEventListener('scroll', endCardCheck, { passive: true });
    addEventListener('resize', endCardCheck, { passive: true });

    // ── GA: scene depth (each scene fires once) + completion + exit clicks ──
    const seenScenes = new Set();
    let completeFired = false;
    function trackDepth() {
      const i = activeSceneIndex();
      if (!seenScenes.has(i)) {
        seenScenes.add(i);
        track('film_scene', { scene: sceneIds[i], index: i + 1 });
        if (i === sceneIds.length - 1 && !completeFired) { completeFired = true; track('film_complete'); }
      }
    }
    let depthTick = false;
    addEventListener('scroll', () => { if (!depthTick) { depthTick = true; setTimeout(() => { depthTick = false; trackDepth(); }, 400); } }, { passive: true });
    trackDepth();
    // An exit click races the navigation that follows it, so fire on
    // pointerdown — a few hundred milliseconds earlier, while the page is
    // still alive — and keep click for keyboard activation, deduped per link
    // so one activation counts once.
    const EXIT_TARGET = {
      'sw-backlink': 'portfolio_topbar', 'sw-cvlink': 'cv_topbar', 'sw-topcta': 'contact_topbar',
      'sw-btn--primary': 'contact_cta', 'sw-btn--cv': 'cv_cta',
      'sw-btn--ghost': 'portfolio_cta', 'ec-portfolio': 'portfolio_end',
      'ec-cv': 'cv_end', 'ec-contact': 'contact_end',
    };
    const exitPending = new Set();
    function onExit(e) {
      const a = e.target && e.target.closest ? e.target.closest('a') : null;
      if (!a || exitPending.has(a)) return;
      let target = null;
      for (const cls in EXIT_TARGET) { if (a.classList.contains(cls)) { target = EXIT_TARGET[cls]; break; } }
      if (!target) return;
      exitPending.add(a);
      setTimeout(() => exitPending.delete(a), 1000);
      track('film_exit', { target: target });
    }
    document.addEventListener('pointerdown', onExit, true);
    document.addEventListener('click', onExit, true);

    applyLanguage(lang);
  })();
  </script>
</body>
</html>
